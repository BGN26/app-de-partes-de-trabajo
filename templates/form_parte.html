{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-sm-12">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">📋 Nuevo Parte de Trabajo Profesional</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Cliente / Empresa</label>
                        <select class="form-select form-select-lg" name="cliente_id" required>
                            <option value="" disabled selected>Selecciona una empresa...</option>
                            {% for c in clientes %}
                            <option value="{{ c.id }}">{{ c.nombre }} (CIF: {{ c.cif }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Descripción del Trabajo</label>
                        <textarea class="form-control" name="descripcion" rows="3" required></textarea>
                    </div>

                    <div class="row mb-4">
                        <div class="col-8">
                            <label class="form-label fw-bold">Tipo de Servicio</label>
                            <select class="form-select" name="servicio_id" required>
                                <option value="" disabled selected>Selecciona tipo...</option>
                                {% for s in servicios %}
                                <option value="{{ s.id }}">{{ s.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-4">
                            <label class="form-label fw-bold">Horas</label>
                            <input type="number" class="form-control" name="horas" min="0" step="0.5" value="0" required>
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="text-muted mb-0">Materiales Utilizados</h5>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="agregarMaterial()">+ Añadir otro material</button>
                    </div>

                    <div id="contenedor-materiales">
                        <div class="row g-2 mb-2 fila-material">
                            <div class="col-8">
                                <select class="form-select" name="materiales[]">
                                    <option value="" selected>Ninguno / Selecciona material...</option>
                                    {% for m in materiales %}
                                    <option value="{{ m.id }}">{{ m.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-4">
                                <input type="number" class="form-control" name="cantidades[]" min="0" placeholder="Cant" value="0">
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar y Procesar en Factura</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function agregarMaterial() {
    const contenedor = document.getElementById('contenedor-materiales');
    const primeraFila = document.querySelector('.fila-material');
    const nuevaFila = primeraFila.cloneNode(true);

    // Reseteamos los valores de la nueva fila clonada
    nuevaFila.querySelector('select').value = "";
    nuevaFila.querySelector('input').value = "0";

    contenedor.appendChild(nuevaFila);
}
</script>
{% endblock %}
